[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-tracebench"
version = "0.1.0"
description = "Record and replay LMCache MP storage traces from vLLM workloads."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
live = [
    "openai>=1.0",
    "datasets>=2.0",
    "pyarrow>=12.0",
]

[project.scripts]
lmcache-trace-recorder = "recorder.main:main"
lmcache-trace-replayer = "replayer.main:main"
lmcache-trace-mooncake = "recorder.mooncake_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["recorder*", "replayer*", "traceprof*"]

[tool.setuptools.package-data]
traceprof = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
