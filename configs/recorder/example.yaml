model:
  id: QuantTrio/Qwen3-Coder-480B-A35B-Instruct-AWQ
  tensor_parallel_size: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  dtype: auto
  max_model_len: 131072
  # H100 80 GB에서 72 GB quota를 모사한다. B300에서 직접 실행하면 0.25로 변경한다.
  gpu_memory_utilization: 0.90

runtime:
  python_hash_seed: "0"
  startup_timeout_seconds: 1800
  vllm_host: 127.0.0.1
  vllm_port: 8000
  process_stop_timeout_seconds: 30

lmcache:
  host: 127.0.0.1
  port: 6555
  chunk_size: 256
  l1:
    size_gb: 20
    init_size_gb: 20
    eviction_policy: noop
    store_policy: skip_l1
  l2:
    type: fs_native
    subpath: lmcache-trace/tensormesh-all
    num_workers: 16
    use_odirect: true
    reset_on_start: true

workload:
  backend: tensormesh
  tensormesh_root: third_party/Tensormesh-Benchmark
  dataset: sammshen/lmcache-agentic-traces
  preset: mixed-realistic
  source: all
  num_sessions: 30
  max_concurrent_sessions: 20
  progress_interval_seconds: 5
  timing_mode: respect-gaps
  pre_gap_scale: 1.0
  mixed_session_order: round_robin
  mixed_source_order: [swebench, gaia, wildclaw]
