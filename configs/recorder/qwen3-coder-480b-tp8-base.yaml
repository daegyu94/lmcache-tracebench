# Shared Qwen3-Coder TP=8 settings. Do not run this file directly.
model:
  id: QuantTrio/Qwen3-Coder-480B-A35B-Instruct-AWQ
  tensor_parallel_size: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  dtype: auto
  max_model_len: 131072
  # H100 80 GB에서 B300 1/4 quota인 72 GB/GPU를 모사한다.
  gpu_memory_utilization: 0.90

runtime:
  python_hash_seed: "0"
  startup_timeout_seconds: 1800
  vllm_host: 127.0.0.1
  vllm_port: 8000
  process_stop_timeout_seconds: 30

lmcache:
  host: 127.0.0.1
  port: 6555
  chunk_size: 256
  l1:
    size_gb: 64
    init_size_gb: 64
    eviction_policy: noop
    store_policy: skip_l1
  l2:
    type: fs_native
    subpath: lmcache-trace/tensormesh-all
    num_workers: 16
    # Bypass the Linux page cache and issue O_DIRECT filesystem I/O.
    use_odirect: true
    reset_on_start: true

workload:
  backend: tensormesh
  tensormesh_root: third_party/Tensormesh-Benchmark
  dataset: sammshen/lmcache-agentic-traces
  preset: mixed-realistic
  source: all
  # No cap: use every session available in the current dataset revision.
  num_sessions: null
  mixed_session_order: round_robin
  mixed_source_order: [swebench, gaia, wildclaw]
  progress_interval_seconds: 5
