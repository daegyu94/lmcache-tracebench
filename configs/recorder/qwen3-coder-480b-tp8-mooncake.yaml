# Shared Mooncake FAST'25 recorder config for Tool/Agent and Conversation.
# Select a downloaded JSONL at launch with --mooncake-trace and --mooncake-path.
model:
  id: QuantTrio/Qwen3-Coder-480B-A35B-Instruct-AWQ
  tensor_parallel_size: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  dtype: auto
  max_model_len: 131072
  gpu_memory_utilization: 0.90

runtime:
  python_hash_seed: "0"
  startup_timeout_seconds: 1800
  vllm_host: 127.0.0.1
  vllm_port: 8000
  process_stop_timeout_seconds: 30

lmcache:
  host: 127.0.0.1
  port: 6555
  chunk_size: 256
  l1:
    size_gb: 20
    init_size_gb: 20
    eviction_policy: noop
    store_policy: skip_l1
  l2:
    type: fs_native
    # recorder.main resolves {trace} to toolagent or conversation.
    base_path: /mnt/std-ssd/lmcache-trace/mooncake-{trace}
    num_workers: 16
    use_odirect: true
    reset_on_start: true

workload:
  backend: mooncake
  progress_interval_seconds: 5
  mooncake:
    # Defaults make this config runnable for Tool/Agent without overrides.
    trace: toolagent
    path: /mnt/std-ssd/traces/mooncake/toolagent_trace.jsonl
    download_if_missing: true
    num_requests: 1000
    # 1.0 preserves the original one-hour arrival timeline; 0.1 is 10x faster.
    time_scale: 1.0
    chunk_hash_size: 512
    max_concurrent_requests: 64
