# Small end-to-end LMCache MP storage-trace smoke test.
# Requires one CUDA GPU and pip-installed lmcache/vllm in the active project .venv.
model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  tensor_parallel_size: 1
  gpu_ids: [0]
  dtype: auto
  max_model_len: 8192
  gpu_memory_utilization: null
  kv_cache_memory_gb_per_gpu: 1
  enable_expert_parallel: false

runtime:
  python_hash_seed: "0"
  startup_timeout_seconds: 600
  vllm_host: 127.0.0.1
  vllm_port: 8000
  process_stop_timeout_seconds: 30

lmcache:
  host: 127.0.0.1
  port: 6555
  chunk_size: 128
  l1:
    size_gb: 1
    init_size_gb: 1
    eviction_policy: noop
    store_policy: skip_l1
  l2:
    type: fs_native
    base_path: /mnt/std-ssd/lmcache-trace-smoke
    num_workers: 1
    use_odirect: true
    reset_on_start: true

workload:
  tensormesh_root: third_party/Tensormesh-Benchmark
  source: swebench
  num_sessions: 10
  max_turns_per_session: 2
  max_input_tokens: 8192
  max_concurrent_sessions: 10
  progress_interval_seconds: 5
  timing_mode: max-pressure
  mixed_session_order: original
  flatten_tools: true
  hf_streaming: false
  hf_cache_dir: /mnt/std-ssd/hf-datasets

output:
  root: outputs/smoke
