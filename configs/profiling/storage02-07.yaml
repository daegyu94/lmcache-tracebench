# B300 replay profiling for the WekaIO storage cluster (weka02-weka07).
# devices entries may use bash-brace-style {a..b} ranges or {a,b,c} lists
# (see traceprof.config.expand_brace_pattern); each expands to one NVMe
# namespace block device per controller (nvmeNn1) before profiling starts.
sample_interval_seconds: 5
report_interval_seconds: 5
remote_tmp_root: /tmp/lmcache-tracebench-profile
ssh_user: user

nodes:
  - hostname: weka02
    devices:
      - /dev/nvme{2..7}n1
    interfaces:
      - bond0
  - hostname: weka03
    devices:
      - /dev/nvme{1,2,4,5,6,7}n1
    interfaces:
      - bond0
  - hostname: weka04
    devices:
      - /dev/nvme{2..6}n1
    interfaces:
      - bond0
  - hostname: weka05
    devices:
      - /dev/nvme{2..6}n1
    interfaces:
      - bond0
  - hostname: weka06
    devices:
      - /dev/nvme{2..6}n1
    interfaces:
      - bond0
  - hostname: weka07
    devices:
      - /dev/nvme{2..6}n1
    interfaces:
      - bond0

# Uncomment this block when client-side network traffic is also needed.
# It measures the replay node's interface using the same TSV schema.
# replay_node:
#   hostname: node1
#   interfaces:
#     - bond0
