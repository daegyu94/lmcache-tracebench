# Optional node-level replay profiling. Remote agents use Linux sysfs counters.
# Both defaults are five seconds: one snapshot and one TSV diff per interval.
sample_interval_seconds: 5
report_interval_seconds: 5
remote_tmp_root: /tmp/lmcache-tracebench-profile
ssh_user: benchmark

nodes:
  - hostname: storage_node1
    devices:
      - /dev/nvme0n1
      - /dev/nvme0n2
    interfaces:
      - bond0
  - hostname: storage_node2
    devices:
      - /dev/nvme0n1
      - /dev/nvme0n2
    interfaces:
      - bond0
  - hostname: storage_node3
    devices:
      - /dev/nvme0n1
      - /dev/nvme0n2
    interfaces:
      - bond0
  - hostname: storage_node4
    devices:
      - /dev/nvme0n1
      - /dev/nvme0n2
    interfaces:
      - bond0

# Uncomment this block when client-side network traffic is also needed.
# It measures node1's interface using the same TSV schema.
